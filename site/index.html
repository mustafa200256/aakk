const sky=X.createLinearGradient(0,hy-H*.2,0,hy);sky.addColorStop(0,'rgba(0,0,0,0)');sky.addColorStop(1,`rgba(90,25,60,${.35*w})`);X.fillStyle=sky;X.fillRect(0,hy-H*.2,W,H*.2);
X.fillStyle='#05030a';X.globalAlpha=w;X.fillRect(0,hy,W,H-hy);X.globalAlpha=1;
CITY.forEach(c=>{const x=c.x*W-px*14*c.w,tw=.4+.6*Math.abs(Math.sin(t*(.6+c.w*.3)+c.p));X.globalAlpha=w*tw*.9;X.fillStyle=c.h>.85?'#c9a45c':'#9a86ff';X.fillRect(x,hy-2-c.h*H*.05,c.w,c.w)});
X.globalAlpha=w*.5;X.fillStyle='#0b0716';for(let i=0;i<14;i++){const bx=(i/14)*W-px*20,bh=10+((i*37)%23)*2;X.fillRect(bx,hy-bh,W/14-4,bh)}
X.globalAlpha=w;X.strokeStyle='rgba(143,107,255,.55)';X.lineWidth=1.2;X.beginPath();X.moveTo(vx,hy);X.lineTo(vx-W*.55,H);X.moveTo(vx,hy);X.lineTo(vx+W*.55,H);X.stroke();
X.fillStyle='#c9a45c';for(let i=0;i<12;i++){const k=((i+sp*1)/12),y=hy+(H-hy)*Math.pow(k,2.2),wd=1+k*7,len=3+k*k*42;X.globalAlpha=w*k;X.fillRect(vx-wd/2,y,wd,len)}
carT-=dt;if(carT<0&&car<=0){car=1.2;carT=4+rnd()*5}
if(car>0){car-=dt;const l=1-car/1.2,k=Math.pow(l,2),y=hy+(H-hy)*Math.pow(k,1.1)*.9,x=vx-(W*.07)*k*3-8,r=2+k*30,a=Math.sin(l*Math.PI);X.globalCompositeOperation='lighter';[-1,1].forEach(s=>{const hx=x+s*r*2.2,gg=X.createRadialGradient(hx,y,0,hx,y,r*3);gg.addColorStop(0,`rgba(255,240,210,${a*w})`);gg.addColorStop(1,'rgba(255,200,120,0)');X.globalAlpha=1;X.fillStyle=gg;X.beginPath();X.arc(hx,y,r*3,0,TAU);X.fill()});X.globalCompositeOperation='source-over'}
hudT-=dt;if(hudT<0&&curMode==='road'){hudT=6+rnd()*6;const h=$('#hudg');h.classList.remove('on');void h.offsetWidth;h.classList.add('on')}
X.globalAlpha=w*.5;X.strokeStyle='#7fe3ff';X.setLineDash([6,6]);X.lineWidth=1;const mx=W*.82,my=H*.16;X.beginPath();X.moveTo(mx-60,my+40);X.lineTo(mx-20,my+10);X.lineTo(mx+15,my+30);X.lineTo(mx+40,my-5);X.stroke();X.setLineDash([]);X.fillStyle='#7fe3ff';X.font='16px monospace';X.fillText('?',mx+46,my-8);X.globalAlpha=1}

if(WT.code>.02){const w=WT.code;X.font='14px ui-monospace,monospace';const tl=mob?6:9,cn=Math.round(cols.length*(.4+qual*.6)*(mob?.55:1));
for(let i=0;i<cn;i++){const c=cols[mob?i*2%cols.length:i];c.y+=c.v*dt*(.5+E*1.3);if(c.y>H+tl*18)c.y=-rnd()*H*.5;for(let k=0;k<tl;k++){X.globalAlpha=w*(1-k/tl)*.45;X.fillStyle=k?'#6d4fd8':'#d9ceff';X.fillText(CHARS[(Math.floor(c.y/18)+k*7+i*3)%CHARS.length],c.x,c.y-k*18)}}
X.globalAlpha=1;const cx=W*(W>H?.76:.5)-px*20,cy=H*(W>H?.5:.5)-py*12,R=Math.min(W,H)*(W>H?.2:.17),ay=t*.3+rotY+px*.8,ax=.5+rotX+py*.5;

/* ---------- FINAL REVEAL (video) ---------- */
const rev=$('#rev'),rtx=$('#rt'),rcap=$('#rcap'),vbg=$('#vbg'),vx=vbg.getContext('2d'),vwrap=$('#vwrap');
let revStarted=false,revTimer=0,rtok=0,vidSet=false,vraf=0,vplaying=false;
function vidLoad(pre){if(!vidSet){vidSet=true;[['video/final.mp4','video/mp4'],['video/final.webm','video/webm']].forEach(x=>{const e=document.createElement('source');e.src=x[0];e.type=x[1];vid.appendChild(e)});vid.load()}vid.preload=pre}
function primeVid(){try{vid.muted=true;const p=vid.play();if(p&&p.then)p.then(()=>{vid.pause();vid.currentTime=0;vid.muted=muted}).catch(()=>{})}catch(e){}}
function revCheck(i){if(F[i].si>=9)vidLoad('auto');clearTimeout(revTimer);if(i===F.length-1&&!revStarted)revTimer=setTimeout(startReveal,7000)}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function duckTo(to,ms){const from=duck,t0=performance.now();(function s(){const k=clamp((performance.now()-t0)/ms,0,1);duck=from+(to-from)*k;if(!muted)au.volume=V*fadeK*duck;if(k<1)requestAnimationFrame(s)})()}
async function rsay(t,ms,cls,tok){if(tok!==rtok)throw 0;rtx.className='';void rtx.offsetWidth;rtx.textContent=t;rtx.className=t?'in '+(cls||''):'';await wait(ms);if(tok!==rtok)throw 0}
function fitVid(){const wide=innerWidth/innerHeight>.8;vid.className=wide?'con':'cov';vbg.style.display=wide?'block':'none'}
addEventListener('resize',()=>{if(revStarted)fitVid()});
function bgLoop(){try{vx.drawImage(vid,0,0,48,82)}catch(e){}vraf=requestAnimationFrame(bgLoop)}
function playVideo(tok){return new Promise(res=>{let done=false,began=false;
const fin=()=>{if(done)return;done=true;cancelAnimationFrame(vraf);vplaying=false;vid.removeEventListener('ended',fin);vid.removeEventListener('error',fin);clearInterval(wd);clearTimeout(sf);res()};
const wd=setInterval(()=>{if(tok!==rtok){vid.pause();fin()}},400),sf=setTimeout(()=>{if(!began)fin()},20000);
const go=()=>{if(done||began)return;began=true;$('#vload').classList.add('hide');fitVid();vid.muted=muted;vid.volume=1;whoosh();rev.classList.add('flash');setTimeout(()=>rev.classList.remove('flash'),1400);vwrap.classList.add('show');
const fall=()=>{vid.muted=true;vid.play().then(()=>{if(!muted)$('#runmute').classList.remove('hide')}).catch(fin)};
try{const p=vid.play();if(p&&p.catch)p.catch(fall)}catch(e){fall()}};
vid.addEventListener('playing',()=>{vplaying=true;if(!vraf||true){cancelAnimationFrame(vraf);bgLoop()}},{once:true});
vid.addEventListener('ended',fin);vid.addEventListener('error',fin);
if(vid.readyState>=3)go();else{$('#vload').classList.remove('hide');vid.addEventListener('canplay',go,{once:true});vidLoad('auto');try{vid.load()}catch(e){}}})}
$('#runmute').addEventListener('click',e=>{vid.muted=false;muted=false;applyVol();e.currentTarget.classList.add('hide')});
function burst(){rev.classList.remove('burst');void rev.offsetWidth;rev.classList.add('burst');whoosh();setTimeout(()=>rev.classList.remove('burst'),1500)}
async function startReveal(){if(revStarted)return;revStarted=true;const tok=++rtok;bd.classList.add('lock');rev.classList.add('on');setHum(false);if(playing)duckTo(0,3500);
try{await rsay('',2200,'',tok);await rsay('عبالكم خلصنا؟',3300,'big',tok);await rsay('',1300,'',tok);await rsay('دباوعوا الجوه...',3100,'big glow',tok);await rsay('',900,'',tok);
await playVideo(tok);if(tok!==rtok)return;vwrap.classList.remove('show');vid.pause();
await rsay('',3800,'',tok);
await rsay('تدرون شنو الغريب؟',2800,'big',tok);await rsay('',900,'',tok);
await rsay('هذا الفيديو...',2300,'big',tok);await rsay('',1300,'',tok);
await rsay('انصنع بأداة ذكاء اصطناعي مجانية.',3800,'big',tok);await rsay('',2300,'',tok);

await rsay('بس هذا الشي...',2100,'big',tok);await rsay('ما راح نحچي عنه هسه.',3000,'big',tok);await rsay('خلوه للمستقبل.',3000,'big glow',tok);await rsay('',1000,'',tok);
await rsay('مصطفى حسين',3200,'huge glitch',tok);await rsay('المبرمج العراقي',2500,'big',tok);await rsay('',800,'',tok);
await rsay('إذا هذا اللي شفتوه مجرد فيديو\nمصنوع بأداة مجانية...',4300,'big',tok);await rsay('',1600,'',tok);
await rsay('عبالكم شنو راح يصير\nمن تدخلون منصتنا؟',4500,'big glow',tok);await rsay('',2800,'',tok);

$('#rskip').addEventListener('click',()=>{const tok=++rtok;vid.pause();vwrap.classList.remove('show');rcap.classList.remove('on');$('#runmute').classList.add('hide');if(playing)duckTo(.55,2500);closing(tok)});
$('#rback').addEventListener('click',()=>{rtok++;rev.classList.remove('on');bd.classList.remove('lock');$('#rback').classList.add('hide');$('#rskip').classList.remove('hide');rtx.textContent='';revStarted=false;if(playing)duckTo(1,2000);scrollTo(0,0);onScroll(true)});
